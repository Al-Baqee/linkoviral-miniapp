

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Linko Viral</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080b18;color:#f5f5ff;font-family:Arial,sans-serif}
header{padding:22px 16px;background:#101329}
h1{margin:0;color:#a78bfa;font-size:27px}
.sub{color:#9298b7;margin-top:7px;font-size:13px}
main{padding:16px;max-width:850px;margin:auto}
input,select,button{font:inherit;border:0;border-radius:10px;padding:12px}
input,select{background:#191d35;color:white;width:100%;margin:6px 0}
.tabs{display:flex;gap:8px;overflow:auto;margin:15px 0}
.tabs button{background:#191d35;color:white;white-space:nowrap}
.tabs button.active,.play{background:#8057f5;color:white}
h2{font-size:19px;margin-top:24px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#12162a;border-radius:13px;overflow:hidden}
.thumb{height:115px;background:linear-gradient(135deg,#33225d,#151b39);display:grid;place-items:center;font-size:35px}
.info{padding:11px}
.name{font-weight:bold;font-size:14px}
.meta{font-size:12px;color:#9da4c4;margin:8px 0}
.play{width:100%;cursor:pointer}
.section{margin-bottom:25px}
#admin{display:none;background:#11162b;padding:14px;border-radius:12px;margin-top:24px}
.small{font-size:12px;color:#9da4c4}
footer{text-align:center;padding:25px;color:#777f9e;font-size:12px}
</style>
</head>
<body>
<header>
  <h1>⚡ LINKO VIRAL</h1>
  <div class="sub">Discover trending videos</div>
</header>
<main>
  <input id="search" placeholder="🔎 Search videos..." oninput="render()">
  <div class="tabs">
    <button class="active" onclick="category='All';setTab(this);render()">All Videos</button>
    <button onclick="category='Trending';setTab(this);render()">🔥 Trending</button>
    <button onclick="category='TikToker';setTab(this);render()">✨ TikToker</button>
    <button onclick="category='Recently Added';setTab(this);render()">🆕 Recently Added</button>
  </div>

  <section class="section">
    <h2>🔥 Trending Videos</h2>
    <div id="trending" class="grid"></div>
  </section>

  <section class="section">
    <h2>🆕 Recently Added</h2>
    <div id="recent" class="grid"></div>
  </section>

  <button onclick="toggleAdmin()" style="background:#242947;color:white;width:100%">⚙️ Admin Panel</button>
  <section id="admin">
    <h2>Add a video</h2>
    <input id="title" placeholder="Video title">
    <input id="thumb" placeholder="Thumbnail image URL (optional)">
    <input id="url" placeholder="Video URL (HTTPS)">
    <select id="cat">
      <option>Trending</option>
      <option>TikToker</option>
      <option>Recently Added</option>
    </select>
    <button class="play" onclick="addVideo()">＋ Add Video</button>
    <p class="small">Demo only: data is saved in this browser. Secure admin login and shared database are not configured.</p>
  </section>
</main>
<footer>LINKO VIRAL · Video discovery</footer>

<script>
const tg=window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

let category='All';
const starter=[
 {title:'Trending Video 01',cat:'Trending',views:1200,url:''},
 {title:'Popular Clip 02',cat:'TikToker',views:950,url:''},
 {title:'Latest Video 03',cat:'Recently Added',views:320,url:''},
 {title:'Viral Clip 04',cat:'Trending',views:780,url:''}
];
let videos=[];
try{videos=JSON.parse(localStorage.getItem('linkoVideos')||'null')||starter}
catch(e){videos=starter}

function setTab(el){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
 el.classList.add('active');
}
function card(v,i){
 const safeTitle=String(v.title).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const image=v.thumb&&/^https:\/\//i.test(v.thumb)
 ? `<img src="${v.thumb}" alt="" style="width:100%;height:115px;object-fit:cover">`
 : `<div class="thumb">▶</div>`;
 return `<article class="card">${image}<div class="info">
 <div class="name">${safeTitle}</div>
 <div class="meta">👁 ${Number(v.views)||0} views · ${v.cat}</div>
 <button class="play" onclick="playVideo(${i})">▶ Play Video</button>
 </div></article>`;
}
function render(){
 const q=document.getElementById('search').value.toLowerCase();
 let list=videos.map((v,i)=>({...v,_i:i})).filter(v=>
  v.title.toLowerCase().includes(q)&&(category==='All'||v.cat===category)
 );
 document.getElementById('trending').innerHTML=list.filter(v=>v.cat==='Trending'||category!=='All').slice(0,10).map(v=>card(v,v._i)).join('')||'<p class="small">No videos found.</p>';
 document.getElementById('recent').innerHTML=list.slice().reverse().slice(0,10).map(v=>card(v,v._i)).join('')||'<p class="small">No videos found.</p>';
}
function playVideo(i){
 const url=videos[i]?.url;
 if(!url||!/^https:\/\//i.test(url)){
  alert('এই ডেমো ভিডিওর লিংক এখনো যোগ করা হয়নি।');
  return;
 }
 if(tg) tg.openLink(url);
 else window.open(url,'_blank','noopener');
}
function toggleAdmin(){
 const el=document.getElementById('admin');
 el.style.display=el.style.display==='block'?'none':'block';
}
function addVideo(){
 const title=document.getElementById('title').value.trim();
 const url=document.getElementById('url').value.trim();
 const thumb=document.getElementById('thumb').value.trim();
 const cat=document.getElementById('cat').value;
 if(!title||!/^https:\/\//i.test(url)){
  alert('Title এবং HTTPS video URL দাও।');return;
 }
 if(thumb&&!/^https:\/\//i.test(thumb)){
  alert('Thumbnail URL HTTPS হতে হবে।');return;
 }
 videos.push({title,url,thumb,cat,views:0});
 try{localStorage.setItem('linkoVideos',JSON.stringify(videos))}
 catch(e){alert('Storage unavailable.');return}
 document.getElementById('title').value='';
 document.getElementById('url').value='';
 document.getElementById('thumb').value='';
 render();
 alert('এই ব্রাউজারে ভিডিও যোগ হয়েছে।');
}
render();
</script>
</body>
</html>
